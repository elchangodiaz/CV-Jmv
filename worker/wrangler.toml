# Servidor de la IA del CV. Se publica desde esta carpeta con: npx wrangler deploy
name = "cv-jmv-ai"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Workers AI incluye una cuota gratuita diaria. Si se agota, la IA deja de responder
# hasta el día siguiente (00:00 UTC). En el plan gratuito nunca se cobra.
[ai]
binding = "AI"

[vars]
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Sitios que pueden usar la IA. Si configuras un dominio propio, agrégalo aquí.
ALLOWED_ORIGINS = "https://cv-jmv-dbf66.web.app,https://cv-jmv-dbf66.firebaseapp.com,http://localhost:5173,http://localhost:4173"

# Máximo de solicitudes por visitante (IP) por minuto.
# (Formato "unsafe" para que funcione también con Wrangler 3.)
[[unsafe.bindings]]
name = "LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 6, period = 60 }
